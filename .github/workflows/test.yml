name: test

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Build test image
        run: docker build -t xraywrt-test:local -f Dockerfile.test .
      - name: Run tests
        run: docker run --rm -v "$PWD:/workspace:ro" -w /workspace xraywrt-test:local bash tests/run.sh
